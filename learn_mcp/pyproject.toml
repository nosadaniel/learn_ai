[project]
name = "learn-mcp"
version = "0.1.0"
description = "A chatbot that can search for research papers by using connected mcp server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "arxiv>=4.0.1",
  "langchain==1.4.0",
  "langchain-anthropic==1.7.2",
  "langchain-google-genai==4.4.0",
  "langchain-mcp-adapters==0.3.2",
  "langchain-ollama==1.1.0",
  "mcp==1.30.0",
  "nest-asyncio==1.6.0",
  "python-dotenv==1.2.3",
]
